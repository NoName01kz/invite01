<html lang="ru">

<title>Мои приглашения — Date Ticket</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#090d16;
  --bg2:#111728;
  --card:rgba(19,25,42,.78);
  --line:rgba(255,255,255,.10);
  --text:#fff;
  --muted:#aeb6c8;
  --pink:#ff6fae;
  --pink2:#ff91bf;
  --gold:#f6c667;
  --danger:#ff667d;
  --green:#71d6a1;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Manrope",sans-serif;
  background:
    radial-gradient(circle at 75% 10%,rgba(255,105,170,.14),transparent 28%),
    radial-gradient(circle at 10% 90%,rgba(95,100,255,.12),transparent 30%),
    linear-gradient(135deg,var(--bg),var(--bg2));
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.28;
  background-image:
    radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 75% 35%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 45% 80%,#fff 0 1px,transparent 1.5px);
  background-size:270px 240px,330px 290px,370px 320px;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:"Manrope",sans-serif;
}

.container{
  width:min(1120px,92%);
  margin:auto;
}

header{
  min-height:80px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  position:relative;
  z-index:3;
}

.logo{
  font:700 25px "Playfair Display",serif;
  font-style:italic;
}

.header-right{
  display:flex;
  align-items:center;
  gap:9px;
}

.email{
  color:var(--muted);
  font-size:11px;
}

.header-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.055);
  color:#fff;
  border-radius:12px;
  padding:10px 13px;
  cursor:pointer;
  font-size:11px;
}

main{
  padding:45px 0 80px;
}

.hero{
  text-align:center;
  margin-bottom:35px;
}

.eyebrow{
  display:inline-block;
  color:#ffc0d8;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.7px;
  margin-bottom:12px;
}

.hero h1{
  font:700 clamp(40px,6vw,62px)/1.05 "Playfair Display",serif;
  margin:0 0 15px;
}

.hero p{
  color:var(--muted);
  line-height:1.7;
  max-width:650px;
  margin:auto;
  font-size:14px;
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.count{
  color:var(--muted);
  font-size:12px;
}

.count strong{
  color:#fff;
}

.toolbar-actions{
  display:flex;
  gap:8px;
}

.btn{
  border:0;
  cursor:pointer;
  border-radius:14px;
  padding:13px 17px;
  color:#fff;
  font:700 12px "Manrope",sans-serif;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  box-shadow:0 12px 35px rgba(255,105,170,.22);
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn.secondary{
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
  box-shadow:none;
}

.btn.danger{
  background:linear-gradient(135deg,#d94d66,#ff667d);
}

.list{
  display:grid;
  gap:15px;
}

.card{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:25px;
  padding:24px;
  backdrop-filter:blur(18px);
  box-shadow:0 25px 70px rgba(0,0,0,.23);
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
}

.card-title{
  display:flex;
  align-items:center;
  gap:13px;
}

.character{
  width:62px;
  height:62px;
  border-radius:18px;
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
}

.title h2{
  margin:0;
  font-size:19px;
}

.title small{
  display:block;
  color:var(--muted);
  margin-top:5px;
  font-size:11px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:7px 10px;
  border-radius:999px;
  font-size:10px;
  white-space:nowrap;
}

.status.waiting{
  color:var(--gold);
  background:rgba(246,198,103,.10);
  border:1px solid rgba(246,198,103,.18);
}

.status.answer{
  color:var(--green);
  background:rgba(113,214,161,.10);
  border:1px solid rgba(113,214,161,.18);
}

.status.no{
  color:var(--muted);
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
}

.details{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:20px;
}

.detail{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.055);
  border-radius:13px;
  padding:12px;
  min-width:0;
}

.detail span{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:5px;
}

.detail strong{
  display:block;
  font-size:11px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.answer-box{
  margin-top:15px;
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(113,214,161,.16);
  background:rgba(113,214,161,.055);
}

.answer-title{
  color:var(--green);
  font-size:11px;
  font-weight:800;
  margin-bottom:8px;
}

.answer-text{
  color:#e9f8ef;
  font-size:13px;
  line-height:1.6;
}

.answer-date{
  color:var(--muted);
  font-size:10px;
  margin-top:7px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:17px;
}

.small-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:#fff;
  border-radius:11px;
  padding:10px 13px;
  cursor:pointer;
  font-size:11px;
  transition:.2s;
}

.small-btn:hover{
  background:rgba(255,255,255,.09);
}

.empty{
  border:1px dashed var(--line);
  border-radius:22px;
  padding:55px 25px;
  text-align:center;
  background:rgba(255,255,255,.025);
}

.empty-icon{
  font-size:55px;
  margin-bottom:12px;
}

.empty h2{
  margin:0 0 8px;
  font-size:21px;
}

.empty p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  max-width:480px;
  margin:0 auto 20px;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:50px 20px;
}

.error{
  border:1px solid rgba(255,102,125,.2);
  background:rgba(255,102,125,.06);
  color:var(--danger);
  border-radius:18px;
  padding:20px;
  text-align:center;
  font-size:12px;
  line-height:1.6;
}

.modal{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  border:1px solid var(--line);
  background:#111728;
  border-radius:25px;
  padding:25px;
  box-shadow:0 30px 100px rgba(0,0,0,.5);
}

.modal-card h2{
  margin:0 0 7px;
  font:700 28px "Playfair Display",serif;
}

.modal-subtitle{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
  margin-bottom:20px;
}

.modal-answer{
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  background:rgba(255,255,255,.04);
}

.modal-row{
  padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;
  justify-content:space-between;
  gap:20px;
  font-size:12px;
}

.modal-row:last-child{
  border-bottom:0;
}

.modal-row span{
  color:var(--muted);
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

.hidden{
  display:none!important;
}

@media(max-width:850px){
  .details{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){

  header{
    min-height:70px;
  }

  .email{
    display:none;
  }

  main{
    padding-top:30px;
  }

  .card{
    padding:19px;
  }

  .card-top{
    flex-direction:column;
  }

  .status{
    align-self:flex-start;
  }

  .details{
    grid-template-columns:1fr 1fr;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr;
  }

  .small-btn{
    width:100%;
  }

  .toolbar-actions{
    width:100%;
  }

  .toolbar-actions .btn{
    flex:1;
  }
}

@media(max-width:390px){
  .details{
    grid-template-columns:1fr;
  }
}
</style>

</head>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyC2esT1S9A8SnTBPyrHVfxTy-Z_u-GiGpWo",

  authDomain:
    "date-ticket-2e786.firebaseapp.com",

  databaseURL:
    "https://date-ticket-2e786-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "date-ticket-2e786",

  storageBucket:
    "date-ticket-2e786.firebasestorage.app",

  messagingSenderId:
    "576969359516",

  appId:
    "1:576969359516:web:2b9e622d7b2de86acc6d59"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const userEmail =
  document.querySelector("#userEmail");

const list =
  document.querySelector("#list");

const count =
  document.querySelector("#count");

const refreshBtn =
  document.querySelector("#refreshBtn");

const logoutBtn =
  document.querySelector("#logoutBtn");

const answerModal =
  document.querySelector("#answerModal");

const closeModal =
  document.querySelector("#closeModal");

const modalSubtitle =
  document.querySelector("#modalSubtitle");

const modalAnswer =
  document.querySelector("#modalAnswer");


let currentUser = null;

let invitations = [];


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatDate(value){

  if(!value){
    return "—";
  }

  const parts =
    String(value).split("-");

  if(parts.length !== 3){
    return value;
  }

  return `${parts[2]}.${parts[1]}.${parts[0]}`;

}


function formatCreatedAt(timestamp){

  if(!timestamp){
    return "—";
  }

  try{

    let date;

    if(
      typeof timestamp.toDate === "function"
    ){

      date =
        timestamp.toDate();

    }else if(
      timestamp.seconds
    ){

      date =
        new Date(
          timestamp.seconds * 1000
        );

    }else{

      date =
        new Date(timestamp);

    }

    if(Number.isNaN(date.getTime())){
      return "—";
    }

    return date.toLocaleString(
      "ru-RU",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch(error){

    return "—";

  }

}


function getInviteUrl(id){

  return new URL(
    `invite.html?id=${encodeURIComponent(id)}`,
    location.href
  ).href;

}


function getStatus(invite){

  if(invite.response){

    return `
      <span class="status answer">
        ✓ Ответ получен
      </span>
    `;

  }

  return `
    <span class="status waiting">
      ⏳ Ожидает ответа
    </span>
  `;

}


function getResponseText(response){

  if(!response){
    return "";
  }

  if(typeof response === "string"){
    return response;
  }

  return (
    response.choice ||
    response.answer ||
    response.selected ||
    response.option ||
    response.message ||
    response.text ||
    "Ответ получен"
  );

}


/* =========================
   RENDER
========================= */

function render(){

  count.textContent =
    invitations.length;


  if(!invitations.length){

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          💌
        </div>

        <h2>
          Пока нет приглашений
        </h2>

        <p>
          Создай своё первое приглашение,
          настрой его и отправь ссылку
          тому, кого хочешь пригласить.
        </p>

        <a
          href="create.html"
          class="btn">
          ✨ Создать приглашение
        </a>

      </div>

    `;

    return;

  }


  list.innerHTML =
    invitations.map(
      (invite,index) => {

        const id =
          escapeHtml(invite.id);

        const nickname =
          escapeHtml(
            invite.nickname ||
            "Без обращения"
          );

        const character =
          escapeHtml(
            invite.character ||
            "💌"
          );

        const theme =
          escapeHtml(
            invite.theme ||
            "—"
          );

        const music =
          invite.music === "none"
            ? "Без музыки"
            : invite.music || "—";

        const dates =
          `${formatDate(invite.from)}
           → ${formatDate(invite.to)}`;

        const responseText =
          getResponseText(
            invite.response
          );

        const hasResponse =
          !!invite.response;


        return `

          <article
            class="card"
            data-id="${id}">

            <div class="card-top">

              <div class="card-title">

                <div class="character">
                  ${character}
                </div>

                <div class="title">

                  <h2>
                    ${nickname}
                  </h2>

                  <small>
                    Создано:
                    ${escapeHtml(
                      formatCreatedAt(
                        invite.createdAt
                      )
                    )}
                  </small>

                </div>

              </div>

              ${
                getStatus(invite)
              }

            </div>


            <div class="details">

              <div class="detail">

                <span>
                  Тема
                </span>

                <strong>
                  ${theme}
                </strong>

              </div>


              <div class="detail">

                <span>
                  Даты
                </span>

                <strong>
                  ${escapeHtml(dates)}
                </strong>

              </div>


              <div class="detail">

                <span>
                  Время
                </span>

                <strong>
                  ${escapeHtml(
                    invite.time || "—"
                  )}
                </strong>

              </div>


              <div class="detail">

                <span>
                  Музыка
                </span>

                <strong>
                  ${escapeHtml(music)}
                </strong>

              </div>

            </div>


            ${
              hasResponse
                ? `

                  <div class="answer-box">

                    <div class="answer-title">
                      Ответ получателя
                    </div>

                    <div class="answer-text">
                      ${escapeHtml(
                        responseText
                      )}
                    </div>

                    ${
                      invite.response?.createdAt
                        ? `
                          <div class="answer-date">
                            Получено:
                            ${escapeHtml(
                              formatCreatedAt(
                                invite.response.createdAt
                              )
                            )}
                          </div>
                        `
                        : ""
                    }

                  </div>

                `
                : ""
            }


            <div class="actions">

              <button
                class="small-btn"
                data-action="open"
                data-id="${id}">
                🎫 Открыть
              </button>


              <button
                class="small-btn"
                data-action="copy"
                data-id="${id}">
                🔗 Копировать ссылку
              </button>


              ${
                hasResponse
                  ? `
                    <button
                      class="small-btn"
                      data-action="answer"
                      data-id="${id}">
                      💌 Посмотреть ответ
                    </button>
                  `
                  : ""
              }

            </div>

          </article>

        `;

      }
    ).join("");


  bindActions();

}


/* =========================
   ACTIONS
========================= */

function bindActions(){

  list
    .querySelectorAll(
      "[data-action='open']"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.id;

          location.href =
            getInviteUrl(id);

        }
      );

    });


  list
    .querySelectorAll(
      "[data-action='copy']"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          const id =
            button.dataset.id;

          const url =
            getInviteUrl(id);

          try{

            await navigator.clipboard.writeText(
              url
            );

            const old =
              button.textContent;

            button.textContent =
              "✓ Скопировано";

            setTimeout(
              () => {

                button.textContent =
                  old;

              },
              1500
            );

          }catch(error){

            prompt(
              "Скопируй ссылку:",
              url
            );

          }

        }
      );

    });


  list
    .querySelectorAll(
      "[data-action='answer']"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.id;

          const invite =
            invitations.find(
              item =>
                item.id === id
            );

          if(invite){

            openAnswer(invite);

          }

        }
      );

    });

}


/* =========================
   ANSWER MODAL
========================= */

function openAnswer(invite){

  const response =
    invite.response;

  const text =
    getResponseText(response);


  modalSubtitle.textContent =
    `Приглашение для ${
      invite.nickname || "получателя"
    }`;


  let html = `

    <div class="modal-row">

      <span>
        Выбор
      </span>

      <strong>
        ${escapeHtml(text)}
      </strong>

    </div>

  `;


  if(response?.message){

    html += `

      <div class="modal-row">

        <span>
          Сообщение
        </span>

        <strong>
          ${escapeHtml(
            response.message
          )}
        </strong>

      </div>

    `;

  }


  if(response?.date){

    html += `

      <div class="modal-row">

        <span>
          Выбранная дата
        </span>

        <strong>
          ${escapeHtml(
            formatDate(
              response.date
            )
          )}
        </strong>

      </div>

    `;

  }


  if(response?.time){

    html += `

      <div class="modal-row">

        <span>
          Выбранное время
        </span>

        <strong>
          ${escapeHtml(
            response.time
          )}
        </strong>

      </div>

    `;

  }


  modalAnswer.innerHTML =
    html;

  answerModal.classList.add(
    "show"
  );

}


function closeAnswer(){

  answerModal.classList.remove(
    "show"
  );

}


closeModal.addEventListener(
  "click",
  closeAnswer
);


answerModal.addEventListener(
  "click",
  event => {

    if(
      event.target === answerModal
    ){

      closeAnswer();

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeAnswer();

    }

  }
);


/* =========================
   LOAD INVITATIONS
========================= */

async function loadInvitations(){

  if(!currentUser){
    return;
  }


  list.innerHTML = `

    <div class="loading">
      Загружаем приглашения…
    </div>

  `;


  try{

    let snapshot;


    /*
      Сначала пробуем запрос
      с сортировкой по createdAt.
    */

    try{

      const q =
        query(
          collection(
            db,
            "invitations"
          ),
          where(
            "ownerUid",
            "==",
            currentUser.uid
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        );

      snapshot =
        await getDocs(q);

    }catch(firstError){

      /*
        Если Firebase попросит создать индекс,
        используем запрос без orderBy.
      */

      console.warn(
        "Запрос с orderBy не выполнен:",
        firstError
      );


      const q =
        query(
          collection(
            db,
            "invitations"
          ),
          where(
            "ownerUid",
            "==",
            currentUser.uid
          )
        );

      snapshot =
        await getDocs(q);

    }


    invitations =
      snapshot.docs.map(
        document => ({
          id:document.id,
          ...document.data()
        })
      );


    /*
      Дополнительная сортировка
      на случай запроса без orderBy.
    */

    invitations.sort(
      (a,b) => {

        const aa =
          a.createdAt?.seconds ||
          a.createdAt?.nanoseconds ||
          0;

        const bb =
          b.createdAt?.seconds ||
          b.createdAt?.nanoseconds ||
          0;

        return bb - aa;

      }
    );


    render();


  }catch(error){

    console.error(error);


    list.innerHTML = `

      <div class="error">

        <strong>
          Не удалось загрузить приглашения.
        </strong>

        <br><br>

        Проверь, что пользователь вошёл
        в аккаунт и Firestore разрешает
        чтение документов коллекции
        <b>invitations</b> для владельца.

        <br><br>

        Код ошибки:
        ${escapeHtml(
          error.code || "unknown"
        )}

      </div>

    `;

  }

}


/* =========================
   REFRESH
========================= */

refreshBtn.addEventListener(
  "click",
  async () => {

    if(!currentUser){
      return;
    }

    refreshBtn.disabled = true;

    refreshBtn.textContent =
      "Загрузка…";

    await loadInvitations();

    refreshBtn.disabled = false;

    refreshBtn.textContent =
      "↻ Обновить";

  }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    try{

      await signOut(auth);

      location.href =
        "index.html";

    }catch(error){

      console.error(error);

      alert(
        "Не удалось выйти из аккаунта."
      );

    }

  }
);


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      location.href =
        "login.html";

      return;

    }


    currentUser =
      user;

    userEmail.textContent =
      user.email || "";


    await loadInvitations();

  }
);
