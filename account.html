<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Аккаунт — Date Ticket</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#090d16;
  --bg2:#111728;
  --card:rgba(19,25,42,.78);
  --line:rgba(255,255,255,.10);
  --text:#fff;
  --muted:#aeb6c8;
  --pink:#ff6fae;
  --pink2:#ff91bf;
  --gold:#f6c667;
  --danger:#ff667d;
  --green:#71d6a1;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Manrope",sans-serif;
  background:
    radial-gradient(circle at 75% 10%,rgba(255,105,170,.14),transparent 28%),
    radial-gradient(circle at 10% 90%,rgba(95,100,255,.12),transparent 30%),
    linear-gradient(135deg,var(--bg),var(--bg2));
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.28;
  background-image:
    radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 75% 35%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 45% 80%,#fff 0 1px,transparent 1.5px);
  background-size:270px 240px,330px 290px,370px 320px;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:"Manrope",sans-serif;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

header{
  min-height:80px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  position:relative;
  z-index:2;
}

.logo{
  font:700 25px "Playfair Display",serif;
  font-style:italic;
}

.header-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.header-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.055);
  color:#fff;
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-size:12px;
}

main{
  padding:45px 0 80px;
}

.hero{
  text-align:center;
  margin-bottom:35px;
}

.eyebrow{
  display:inline-block;
  color:#ffc0d8;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.7px;
  margin-bottom:12px;
}

.hero h1{
  font:700 clamp(40px,6vw,62px)/1.05 "Playfair Display",serif;
  margin:0 0 15px;
}

.hero p{
  color:var(--muted);
  line-height:1.7;
  max-width:600px;
  margin:auto;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:22px;
  align-items:start;
}

.card{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:26px;
  padding:28px;
  backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.profile{
  text-align:center;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  background:
    radial-gradient(circle at 30% 20%,#ff91bf,transparent 40%),
    linear-gradient(135deg,#44203c,#151a31);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 15px 40px rgba(255,105,170,.15);
}

.profile h2{
  margin:0 0 7px;
  font-size:21px;
}

.email{
  color:var(--muted);
  font-size:12px;
  word-break:break-word;
}

.profile-actions{
  display:grid;
  gap:10px;
  margin-top:25px;
}

.btn{
  border:0;
  cursor:pointer;
  border-radius:14px;
  padding:14px 18px;
  color:#fff;
  font:700 13px "Manrope",sans-serif;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  box-shadow:0 12px 35px rgba(255,105,170,.22);
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn.secondary{
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
  box-shadow:none;
}

.btn.danger{
  background:linear-gradient(135deg,#d94d66,#ff667d);
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.section-title h2{
  margin:0;
  font-size:21px;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

.invites{
  display:grid;
  gap:12px;
}

.invite{
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
  border-radius:18px;
  padding:18px;
  transition:.2s;
}

.invite:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.065);
}

.invite-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.invite-name{
  font-weight:800;
  font-size:15px;
}

.invite-character{
  font-size:29px;
}

.invite-info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:13px;
}

.info{
  padding:10px 12px;
  border-radius:12px;
  background:rgba(255,255,255,.04);
}

.info span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:3px;
}

.info strong{
  font-size:11px;
}

.invite-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}

.small-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:#fff;
  border-radius:11px;
  padding:9px 12px;
  cursor:pointer;
  font-size:11px;
}

.empty{
  text-align:center;
  padding:45px 20px;
  border:1px dashed var(--line);
  border-radius:18px;
  color:var(--muted);
}

.empty-icon{
  font-size:45px;
  margin-bottom:10px;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:30px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  border-radius:999px;
  font-size:10px;
  background:rgba(113,214,161,.10);
  color:var(--green);
}

.status.pending{
  background:rgba(246,198,103,.10);
  color:var(--gold);
}

.status.no{
  background:rgba(255,255,255,.06);
  color:var(--muted);
}

.error{
  color:var(--danger);
  text-align:center;
  font-size:12px;
  line-height:1.6;
  padding:20px;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr;
  }

  .profile{
    max-width:600px;
    margin:auto;
  }
}

@media(max-width:520px){
  header{
    min-height:70px;
  }

  .header-btn{
    padding:9px 10px;
  }

  main{
    padding-top:30px;
  }

  .card{
    padding:22px;
  }

  .invite-info{
    grid-template-columns:1fr;
  }

  .invite-actions{
    display:grid;
    grid-template-columns:1fr;
  }

  .small-btn{
    width:100%;
  }
}
</style>

</head>

<body>

<div class="container">

<header>
  <a class="logo" href="index.html">Date Ticket</a>

  <div class="header-actions">
    <a class="header-btn" href="create.html">Создать</a>
    <a class="header-btn" href="admin.html">Админка</a>
  </div>
</header>

<main>

<section class="hero">
  <span class="eyebrow">Твой аккаунт</span>
  <h1>Личный кабинет</h1>
  <p>
    Здесь находятся данные твоего аккаунта
    и все созданные тобой приглашения.
  </p>
</section>

<section class="grid">

  <div class="card profile">

```
<div class="avatar">💌</div>

<h2 id="profileName">Загрузка…</h2>

<div
  class="email"
  id="profileEmail">
  Загрузка…
</div>

<div class="profile-actions">

  <a
    class="btn"
    href="create.html">
    ✨ Создать приглашение
  </a>

  <a
    class="btn secondary"
    href="admin.html">
    📊 Открыть мои приглашения
  </a>

  <button
    class="btn danger"
    id="logoutBtn"
    type="button">
    Выйти
  </button>

</div>
```

  </div>

  <div class="card">

```
<div class="section-title">
  <h2>Мои приглашения</h2>
  <span id="inviteCount">0</span>
</div>

<div
  id="invites"
  class="invites">

  <div class="loading">
    Загружаем приглашения…
  </div>

</div>
```

  </div>

</section>

</main>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyC2es1T9S8AnTBPyrHVfxTy-Z_u-GiGpWo",
  authDomain:"date-ticket-2e786.firebaseapp.com",
  databaseURL:"https://date-ticket-2e786-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"date-ticket-2e786",
  storageBucket:"date-ticket-2e786.firebasestorage.app",
  messagingSenderId:"576969359516",
appId: "1:576969359516:web:f98ef1519fe502d4cc6d59"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


const profileName =
  document.querySelector("#profileName");

const profileEmail =
  document.querySelector("#profileEmail");

const invitesBox =
  document.querySelector("#invites");

const inviteCount =
  document.querySelector("#inviteCount");

const logoutBtn =
  document.querySelector("#logoutBtn");


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatDate(value){

  if(!value) return "—";

  const parts =
    String(value).split("-");

  if(parts.length !== 3)
    return value;

  return `${parts[2]}.${parts[1]}.${parts[0]}`;

}


function statusHtml(item){

  if(item.response){

    return `
      <span class="status">
        ✓ Ответ получен
      </span>
    `;

  }

  if(item.status === "created"){

    return `
      <span class="status pending">
        ⏳ Ждёт ответа
      </span>
    `;

  }

  return `
    <span class="status no">
      Создано
    </span>
  `;

}


function inviteUrl(id){

  return new URL(
    `invite.html?id=${encodeURIComponent(id)}`,
    location.href
  ).href;

}


function renderInvites(items){

  inviteCount.textContent =
    items.length;

  if(!items.length){

    invitesBox.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          💌
        </div>

        <strong>
          У тебя пока нет приглашений
        </strong>

        <p>
          Создай первое приглашение,
          чтобы оно появилось здесь.
        </p>

        <a
          class="btn"
          href="create.html">
          Создать приглашение
        </a>

      </div>
    `;

    return;

  }


  invitesBox.innerHTML =
    items.map(item => {

      const id =
        escapeHtml(item.id);

      const nickname =
        escapeHtml(
          item.nickname || "Без имени"
        );

      const character =
        escapeHtml(
          item.character || "💌"
        );

      const theme =
        escapeHtml(
          item.theme || "—"
        );

      const dates =
        `${formatDate(item.from)} → ${formatDate(item.to)}`;

      return `
        <article class="invite">

          <div class="invite-top">

            <div>
              <div class="invite-name">
                ${nickname}
              </div>

              <div style="margin-top:7px">
                ${statusHtml(item)}
              </div>
            </div>

            <div class="invite-character">
              ${character}
            </div>

          </div>

          <div class="invite-info">

            <div class="info">
              <span>Тема</span>
              <strong>${theme}</strong>
            </div>

            <div class="info">
              <span>Дата</span>
              <strong>${escapeHtml(dates)}</strong>
            </div>

            <div class="info">
              <span>Время</span>
              <strong>${escapeHtml(item.time || "—")}</strong>
            </div>

            <div class="info">
              <span>Ответ</span>
              <strong>
                ${
                  item.response
                    ? escapeHtml(
                        item.response.choice ||
                        item.response.answer ||
                        "Получен"
                      )
                    : "Пока нет"
                }
              </strong>
            </div>

          </div>

          <div class="invite-actions">

            <button
              class="small-btn"
              data-open="${id}">
              Открыть
            </button>

            <button
              class="small-btn"
              data-copy="${id}">
              Копировать ссылку
            </button>

            <button
              class="small-btn"
              data-admin="${id}">
              Ответ
            </button>

          </div>

        </article>
      `;

    }).join("");


  invitesBox
    .querySelectorAll("[data-open]")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () => {

          location.href =
            inviteUrl(btn.dataset.open);

        }
      );

    });


  invitesBox
    .querySelectorAll("[data-copy]")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        async () => {

          const url =
            inviteUrl(btn.dataset.copy);

          try{

            await navigator.clipboard.writeText(url);

            const old =
              btn.textContent;

            btn.textContent =
              "Скопировано ✓";

            setTimeout(
              () => {
                btn.textContent = old;
              },
              1500
            );

          }catch(error){

            prompt(
              "Скопируй ссылку:",
              url
            );

          }

        }
      );

    });


  invitesBox
    .querySelectorAll("[data-admin]")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () => {

          location.href =
            `admin.html?id=${encodeURIComponent(btn.dataset.admin)}`;

        }
      );

    });

}


async function loadInvitations(user){

  invitesBox.innerHTML = `
    <div class="loading">
      Загружаем приглашения…
    </div>
  `;

  try{

    const q =
      query(
        collection(db,"invitations"),
        where("ownerUid","==",user.uid),
        orderBy("createdAt","desc")
      );

    const snapshot =
      await getDocs(q);

    const items =
      snapshot.docs.map(doc => ({
        id:doc.id,
        ...doc.data()
      }));

    renderInvites(items);

  }catch(error){

    console.error(error);

    /*
      Если в Firestore ещё нет индекса
      для ownerUid + createdAt, используем
      более простой запрос.
    */

    try{

      const q =
        query(
          collection(db,"invitations"),
          where("ownerUid","==",user.uid)
        );

      const snapshot =
        await getDocs(q);

      const items =
        snapshot.docs.map(doc => ({
          id:doc.id,
          ...doc.data()
        }));

      items.sort(
        (a,b) => {

          const aa =
            a.createdAt?.seconds || 0;

          const bb =
            b.createdAt?.seconds || 0;

          return bb - aa;

        }
      );

      renderInvites(items);

    }catch(secondError){

      console.error(secondError);

      invitesBox.innerHTML = `
        <div class="error">
          Не удалось загрузить приглашения.
          <br><br>
          Проверь правила Firestore.
        </div>
      `;

    }

  }

}


logoutBtn.addEventListener(
  "click",
  async () => {

    try{

      await signOut(auth);

      location.href =
        "index.html";

    }catch(error){

      console.error(error);

    }

  }
);


onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      location.href =
        "login.html";

      return;

    }

    profileEmail.textContent =
      user.email || "Email не указан";

    profileName.textContent =
      user.displayName ||
      "Мой аккаунт";

    await loadInvitations(user);

  }
);

</script>

</body>
</html>
