<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аккаунт — Date Ticket</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0c12;--panel:#151722;--panel2:#1b1d2a;--line:rgba(255,255,255,.09);--text:#faf8fb;--muted:#a7a4b2;--pink:#ff6fae;--pink2:#ff9bc5;--cream:#fff4e9;--gold:#e7b96a;--green:#72d6a0;--red:#ff7085}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,rgba(255,111,174,.13),transparent 30%),radial-gradient(circle at 90% 80%,rgba(116,98,255,.12),transparent 28%),var(--bg);color:var(--text);font:500 14px Manrope,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:110px 110px}.wrap{width:min(1120px,92%);margin:auto;position:relative}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.top{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font:700 23px "Playfair Display",serif;font-style:italic}.nav{display:flex;gap:8px;align-items:center}.nav a,.nav button{border:1px solid var(--line);background:rgba(255,255,255,.045);color:#fff;padding:10px 13px;border-radius:12px;cursor:pointer}.muted{color:var(--muted)}.hero{padding:65px 0 85px}.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:55px;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:#ffc0d9;font-weight:800}.title{font:700 clamp(44px,7vw,78px)/.98 "Playfair Display",serif;margin:15px 0 22px;letter-spacing:-2px}.lead{font-size:16px;line-height:1.75;color:var(--muted);max-width:620px}.btn{border:0;border-radius:14px;padding:14px 19px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 12px 30px rgba(255,111,174,.18)}.btn.secondary{background:rgba(255,255,255,.05);border:1px solid var(--line);box-shadow:none}.btn.green{background:linear-gradient(135deg,#52bb87,#7ce0ad)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.card{background:rgba(21,23,34,.82);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.22);backdrop-filter:blur(18px)}.section{padding:45px 0}.section h2{font:700 40px "Playfair Display",serif;margin:0 0 10px}.field{margin-top:18px}label{display:block;font-size:12px;font-weight:800;margin-bottom:8px}input,textarea,select{width:100%;padding:14px 15px;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:13px;color:#fff;outline:0}textarea{min-height:150px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:rgba(255,111,174,.65);box-shadow:0 0 0 4px rgba(255,111,174,.07)}.error{color:var(--red);font-size:12px;margin-top:10px}.success{color:var(--green);font-size:12px;margin-top:10px}.hidden{display:none!important}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px}.option{padding:15px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.04);cursor:pointer;transition:.2s}.option:hover{transform:translateY(-2px)}.option.selected{border-color:rgba(255,111,174,.8);background:rgba(255,111,174,.1)}.option b{display:block;margin-top:6px}.option small{display:block;color:var(--muted);margin-top:3px}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.theme{height:90px;border:2px solid transparent;border-radius:15px;display:flex;align-items:end;padding:11px;font-weight:800;cursor:pointer}.theme.selected{border-color:#fff}.sakura{background:linear-gradient(135deg,#5b294b,#17182a)}.galaxy{background:linear-gradient(135deg,#1d2769,#090b17)}.sunset{background:linear-gradient(135deg,#8c3e50,#e9a35e)}.ocean{background:linear-gradient(135deg,#0a5964,#13243d)}.rain{background:linear-gradient(135deg,#243c54,#71879b)}.city{background:linear-gradient(135deg,#33265b,#0b0c13)}.progress{height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:.3s}.step{display:none}.step.active{display:block}.stepHead{margin:42px 0 25px}.stepHead h1{font:700 50px/1.05 "Playfair Display",serif;margin:10px 0}.stepLayout{display:grid;grid-template-columns:1fr .8fr;gap:40px}.preview{min-height:360px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}.preview:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,111,174,.2),transparent 68%)}.preview .emoji{font-size:120px;position:relative;z-index:1}.preview p{position:relative;z-index:1;color:var(--muted)}.reviewRow{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}.reviewRow span{color:var(--muted)}.ticket{color:#19151b;background:var(--cream);border-radius:24px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.35);position:relative}.ticketTop{padding:26px 28px 20px;background:linear-gradient(135deg,#fff8f0,#ffe6f0)}.ticketBrand{display:flex;justify-content:space-between;gap:10px;font-size:10px;text-transform:uppercase;letter-spacing:1.8px;font-weight:900;color:#7b6270}.ticketTitle{font:700 38px "Playfair Display",serif;margin:25px 0 5px}.ticketNick{font-size:14px;color:#795e6c}.ticketBody{padding:25px 28px}.ticketRow{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px dashed rgba(30,20,30,.18)}.ticketRow:last-child{border-bottom:0}.ticketRow span{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8b7882}.ticketRow b{text-align:right}.ticketCode{padding:20px 28px;background:#f5e8dc;display:flex;justify-content:space-between;align-items:center;gap:20px}.barcode{font-family:monospace;letter-spacing:3px;font-size:17px}.auth{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:30px 0 70px}.authCard{width:min(480px,100%)}.center{text-align:center}.list{display:grid;gap:12px}.listItem{padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04);display:flex;justify-content:space-between;gap:15px;align-items:center}.tag{padding:5px 8px;border-radius:99px;background:rgba(255,111,174,.1);color:#ffc3dc;font-size:10px;font-weight:800}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:800px){.grid2,.stepLayout{grid-template-columns:1fr;gap:25px}.title{font-size:53px}.stepHead h1{font-size:40px}.preview{min-height:280px}.themes{grid-template-columns:1fr 1fr}}@media(max-width:520px){.options{grid-template-columns:1fr 1fr}.nav .hideMob{display:none}.card{padding:21px}.title{font-size:46px}.ticketTitle{font-size:32px}}
</style></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html">Date Ticket</a><nav class="nav"><a href="create.html">Создать</a><button id="logout">Выйти</button></nav></header>
<section class="section"><div class="grid2"><div class="card"><span class="eyebrow">мой аккаунт</span><h1 class="stepHead">Профиль.</h1><div class="field"><label>Имя</label><input id="name" placeholder="Твоё имя"></div><div class="field"><label>Email</label><input id="email" readonly></div><div id="msg" class="success"></div><div class="actions"><button id="save" class="btn">Сохранить</button></div></div><div><span class="eyebrow">твои приглашения</span><h2 style="font:700 42px 'Playfair Display',serif">Мои билеты.</h2><div id="list" class="list"></div></div></div></section>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyC2esT1S9A8SnTBPyrHVfxTy-Z_u-GiGpWo",
  authDomain: "date-ticket-2e786.firebaseapp.com",
  databaseURL: "https://date-ticket-2e786-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "date-ticket-2e786",
  storageBucket: "date-ticket-2e786.firebasestorage.app",
  messagingSenderId: "576969359516",
  appId: "1:576969359516:web:f98ef1519fe502d4cc6d59"
};
const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore();
onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html';return}document.querySelector('#email').value=u.email||'';document.querySelector('#name').value=u.displayName||'';load(u)});
document.querySelector('#logout').onclick=()=>signOut(auth).then(()=>location.href='index.html');
document.querySelector('#save').onclick=async()=>{const u=auth.currentUser;await updateProfile(u,{displayName:document.querySelector('#name').value.trim()});document.querySelector('#msg').textContent='Профиль сохранён ✓';setTimeout(()=>document.querySelector('#msg').textContent='',1500)};
async function load(u){const box=document.querySelector('#list');box.innerHTML='<div class="empty">Загружаем…</div>';try{const q=query(collection(db,'invitations'),where('ownerUid','==',u.uid)),s=await getDocs(q);if(s.empty){box.innerHTML='<div class="empty">Пока нет приглашений.<br><br><a class="btn" href="create.html">Создать первое</a></div>';return}const arr=[];s.forEach(x=>arr.push({id:x.id,...x.data()}));arr.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));box.innerHTML='';arr.forEach(d=>{const e=document.createElement('div');e.className='listItem';e.innerHTML=`<div><b>${d.nickname||'Приглашение'}</b><div class="muted" style="margin-top:5px">${d.response?`Ответ: ${d.response.choice} · ${d.response.date}`:'Ответа пока нет'}</div></div><div><span class="tag">${d.response?'ОТВЕТ':'ОЖИДАНИЕ'}</span><br><a class="muted" href="invite.html?id=${d.id}">Открыть</a></div>`;box.appendChild(e)})}catch(e){console.error(e);box.innerHTML='<div class="empty">Не удалось загрузить приглашения. Проверь Firestore Rules.</div>'}}
</script>
</body></html>
