<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Твой Date Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a12;--card:#121625e8;--line:#ffffff18;--text:#fff;--muted:#aab2c5;--pink:#ff78b5;--pink2:#ffb0d2;--gold:#ffd47a;--green:#75d9a5;--red:#ff7188}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 15% 10%,#ff78b51f,transparent 30%),radial-gradient(circle at 90% 80%,#6f72ff20,transparent 32%),linear-gradient(135deg,#080a12,#111629);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 80% 30%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 50% 75%,#fff 0 1px,transparent 1.5px);background-size:260px 220px,330px 280px,400px 330px}a{text-decoration:none;color:inherit}.wrap{width:min(1120px,92%);margin:auto}.top{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative;z-index:2}.logo{font-family:Georgia,serif;font-style:italic;font-size:25px;font-weight:700}.nav{display:flex;gap:9px;align-items:center}.nav button,.nav a{border:1px solid var(--line);background:#ffffff09;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;cursor:pointer}.muted{color:var(--muted)}main{padding:45px 0 80px}.card{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);border-radius:28px;box-shadow:0 30px 90px #0006}.btn{border:0;border-radius:15px;padding:14px 20px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 12px 35px #ff78b52b}.btn.secondary{background:#ffffff0b;border:1px solid var(--line);box-shadow:none}.btn.green{background:linear-gradient(135deg,#4fbf88,#79ddb0)}.btn.red{background:linear-gradient(135deg,#d9506b,#ff7188)}.btn:disabled{opacity:.45;cursor:not-allowed}.field{margin-top:18px}label{display:block;font-size:13px;font-weight:800;margin-bottom:9px}input,textarea,select{width:100%;border:1px solid var(--line);outline:0;border-radius:15px;background:#ffffff09;color:#fff;padding:15px 16px;font:500 14px inherit}textarea{min-height:150px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#ff78b58c;box-shadow:0 0 0 4px #ff78b512}.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:24px}.hidden{display:none!important}.err{color:var(--red);font-size:12px;line-height:1.5;margin-top:12px}.ok{color:var(--green);font-size:12px}.grid{display:grid;gap:14px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.hero{min-height:calc(100vh - 80px);display:grid;grid-template-columns:1.1fr .9fr;gap:45px;align-items:center}.hero h1{font:700 clamp(48px,7vw,78px)/.98 Georgia,serif;letter-spacing:-2px;margin:12px 0 20px}.hero p{color:var(--muted);line-height:1.8;max-width:580px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:#ffc2dc;font-weight:800}.ticket-mini{padding:28px;border-radius:24px;background:linear-gradient(145deg,#21152a,#111729);border:1px solid #ffffff18;transform:rotate(2deg);box-shadow:0 35px 80px #0007}.ticket-mini .stub{border-top:1px dashed #ffffff38;margin-top:22px;padding-top:18px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.auth{min-height:calc(100vh - 80px);display:grid;place-items:center}.auth-card{width:min(480px,100%);padding:34px}.auth-card h1{text-align:center;font:700 42px Georgia,serif;margin:0 0 10px}.auth-card>p{text-align:center;color:var(--muted);line-height:1.6;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0}.tabs button{padding:12px;border:1px solid var(--line);background:#ffffff07;color:var(--muted);border-radius:12px;cursor:pointer}.tabs button.active{color:#fff;border-color:#ff78b566;background:#ff78b512}.steps{display:flex;gap:7px;margin-bottom:25px}.steps span{height:5px;flex:1;border-radius:99px;background:#ffffff0d}.steps span.active{background:linear-gradient(90deg,var(--pink),var(--gold))}.creator{max-width:1000px;margin:auto}.creator h1{font:700 clamp(38px,5vw,58px) Georgia,serif;margin:0 0 12px}.creator p{color:var(--muted);line-height:1.7}.step{display:none}.step.active{display:block}.step-card{padding:32px}.choice{border:1px solid var(--line);border-radius:17px;padding:16px;background:#ffffff07;cursor:pointer;transition:.2s}.choice:hover{transform:translateY(-2px);background:#ffffff0d}.choice.selected{border-color:#ff78b58c;background:#ff78b512;box-shadow:0 0 0 2px #ff78b512 inset}.choice .emoji{font-size:28px}.choice small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.review-row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #ffffff0a;font-size:13px}.review-row span{color:var(--muted)}.list{display:grid;gap:13px}.invite-card{padding:22px}.invite-card h3{margin:0 0 6px}.invite-card p{margin:5px 0;color:var(--muted);font-size:13px}.badge{display:inline-block;padding:6px 9px;border-radius:99px;background:#ff78b514;color:#ffc1dc;font-size:10px}.ticket{position:relative;overflow:hidden;background:linear-gradient(150deg,#fff9f5,#f3e7e0);color:#201923;border-radius:28px;box-shadow:0 35px 100px #0008}.ticket:before,.ticket:after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:#080a12;top:56%;transform:translateY(-50%);z-index:3}.ticket:before{left:-15px}.ticket:after{right:-15px}.ticket-top{padding:34px 38px 25px;background:linear-gradient(135deg,#ffd8e8,#fff1d2)}.ticket-brand{font-size:11px;letter-spacing:2px;font-weight:900;text-transform:uppercase;color:#7b5365}.ticket-title{font:700 clamp(38px,6vw,65px) Georgia,serif;margin:10px 0}.ticket-sub{color:#765f6b}.ticket-body{padding:28px 38px}.ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.ticket-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#9a7c89;font-weight:900}.ticket-value{font-weight:800;margin-top:5px}.ticket-divider{border-top:2px dashed #cdbbc1;margin:25px 0}.ticket-code{font:900 28px ui-monospace,monospace;letter-spacing:5px}.ticket-foot{padding:18px 38px 28px;border-top:1px solid #0000000d;display:flex;justify-content:space-between;gap:15px;align-items:end}.ticket-foot small{color:#8f7983}.answer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer{border:2px solid transparent;border-radius:18px;padding:18px;background:#ffffffc7;cursor:pointer;color:#211923}.answer.selected{border-color:#ff70a9;background:#fff}.center{max-width:900px;margin:auto}.center h1{text-align:center;font:700 50px Georgia,serif}.center>p{text-align:center;color:var(--muted);line-height:1.7}.profile{padding:28px}.profile-row{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #ffffff0a}.profile-row span{color:var(--muted)}@media(max-width:800px){.hero{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.ticket-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){main{padding-top:25px}.three,.answer-grid{grid-template-columns:1fr 1fr}.step-card,.auth-card{padding:23px}.ticket-top,.ticket-body,.ticket-foot{padding-left:24px;padding-right:24px}.ticket-title{font-size:42px}.nav .hide-mobile{display:none}}
</style></head><body>
<div class="wrap"><header class="top"><a class="logo" href="index.html">Date Ticket</a><nav class="nav"><a href="login.html">Создать свой</a></nav></header>
<main><section class="center"><div id="loading" class="card" style="padding:40px;text-align:center">Открываем твой билет…</div>
<div id="quiz" class="card hidden" style="padding:32px"><span class="eyebrow">Твой билет</span><h1 style="font:700 45px Georgia,serif">Небольшой вопрос 💗</h1><p class="muted">Выбери, что тебе больше хочется. Здесь только варианты, которые выбрал автор приглашения.</p><div id="answers" class="answer-grid"></div><div class="actions"><button id="answerBtn" class="btn">Выбрать ✨</button></div><div id="err" class="err"></div></div>
<div id="ticketWrap" class="hidden"></div></section></main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,getDocs,query,where,serverTimestamp,updateDoc} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWuTix_eVqHnm76NlyVM19uKOF12PJ480",
  authDomain: "invite01.firebaseapp.com",
  projectId: "invite01",
  storageBucket: "invite01.firebasestorage.app",
  messagingSenderId: "183396425053",
  appId: "1:183396425053:web:a859c4996191e7217ddcb4"
};

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);

const id=new URLSearchParams(location.search).get("id"),$=x=>document.getElementById(x);let data,selected=null;
function fmtDate(s){if(!s)return"—";let [y,m,d]=s.split("-");return `${d}.${m}.${y}`}
function showTicket(){const unlock=data.letterUnlock?new Date(data.letterUnlock):null;let letter="";if(data.letter){if(!unlock||Date.now()>=unlock.getTime())letter=`<div class="ticket-divider"></div><div class="ticket-label">Личное сообщение</div><p style="white-space:pre-wrap;line-height:1.7">${esc(data.letter)}</p>`;else letter=`<div class="ticket-divider"></div><div class="ticket-label">Личное сообщение</div><p>Откроется позже 💌</p>`}$("ticketWrap").innerHTML=`<article class="ticket"><div class="ticket-top"><div class="ticket-brand">DATE TICKET · ADMIT ONE</div><div class="ticket-title">Свидание</div><div class="ticket-sub">Для ${esc(data.nickname||"тебя")} — один особенный вечер.</div></div><div class="ticket-body"><div style="font-size:64px">${data.character||"🐸"}</div><div class="ticket-grid" style="margin-top:22px"><div><div class="ticket-label">Когда</div><div class="ticket-value">${fmtDate(data.from)} — ${fmtDate(data.to)}</div></div><div><div class="ticket-label">Время</div><div class="ticket-value">${esc(data.time||"—")}</div></div></div><div class="ticket-divider"></div><div class="ticket-label">Твоя выбранная идея</div><div class="ticket-value" style="font-size:24px">${esc(data.recipientAnswer||"Выбери один вариант")}</div>${letter}<div class="ticket-divider"></div><div class="ticket-label">Ticket ID</div><div class="ticket-code">${esc(id)}</div></div><div class="ticket-foot"><small>Покажи этот билет в день свидания.</small><b>♥</b></div></article>`;$("ticketWrap").classList.remove("hidden");$("loading").classList.add("hidden");$("quiz").classList.add("hidden")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){if(!id){$("loading").textContent="Ссылка на приглашение неполная.";return}try{let snap=await getDoc(doc(db,"invitations",id));if(!snap.exists()){$("loading").textContent="Такого приглашения нет.";return}data=snap.data();if(data.recipientOpened){showTicket();return}$("answers").innerHTML=(data.survey||[]).map(n=>`<div class="answer" data-v="${esc(n)}"><b>${esc(n)}</b></div>`).join("");$("answers").querySelectorAll(".answer").forEach(x=>x.onclick=()=>{$("answers").querySelectorAll(".answer").forEach(a=>a.classList.remove("selected"));x.classList.add("selected");selected=x.dataset.v});$("loading").classList.add("hidden");$("quiz").classList.remove("hidden")}catch(e){console.error(e);$("loading").textContent="Не удалось открыть приглашение."}}
$("answerBtn").onclick=async()=>{if(!selected){$("err").textContent="Выбери один вариант.";return}$("answerBtn").disabled=true;try{await updateDoc(doc(db,"invitations",id),{recipientAnswer:selected,recipientOpened:true,status:"answered"});data.recipientAnswer=selected;data.recipientOpened=true;showTicket()}catch(e){$("err").textContent=e.message||"Не удалось сохранить ответ."}finally{$("answerBtn").disabled=false}};load();
</script></body></html>
