<style>
:root{
  --bg:#090d16;
  --bg2:#111728;
  --card:rgba(19,25,42,.82);
  --line:rgba(255,255,255,.10);
  --text:#fff;
  --muted:#aeb6c8;
  --pink:#ff6fae;
  --pink2:#ff91bf;
  --danger:#ff667d;
  --green:#71d6a1;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  color:var(--text);
  font-family:"Manrope",sans-serif;
  background:
    radial-gradient(circle at 75% 10%,rgba(255,105,170,.16),transparent 28%),
    radial-gradient(circle at 10% 90%,rgba(95,100,255,.13),transparent 30%),
    linear-gradient(135deg,var(--bg),var(--bg2));
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.28;
  background-image:
    radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 75% 35%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 45% 80%,#fff 0 1px,transparent 1.5px);
  background-size:
    270px 240px,
    330px 290px,
    370px 320px;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font-family:"Manrope",sans-serif;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

/* HEADER */

header{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:2;
}

.logo{
  font:700 24px "Playfair Display",serif;
  font-style:italic;
}

/* LOGIN */

.auth{
  min-height:calc(100vh - 78px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 0 70px;
  position:relative;
  z-index:1;
}

.auth-card{
  width:min(470px,100%);
  padding:38px;
  border:1px solid var(--line);
  border-radius:28px;
  background:var(--card);
  backdrop-filter:blur(18px);
  box-shadow:0 30px 90px rgba(0,0,0,.35);
}

.icon{
  text-align:center;
  font-size:62px;
  margin-bottom:15px;
  animation:float 4s ease-in-out infinite;
}

h1{
  margin:0;
  text-align:center;
  font:700 42px/1.05 "Playfair Display",serif;
}

.subtitle{
  color:var(--muted);
  text-align:center;
  font-size:14px;
  line-height:1.7;
  margin:15px auto 28px;
  max-width:390px;
}

.field{
  margin-top:18px;
}

label{
  display:block;
  margin-bottom:9px;
  font-size:13px;
  font-weight:700;
}

input{
  width:100%;
  padding:16px 17px;
  border-radius:15px;
  border:1px solid var(--line);
  outline:none;
  background:rgba(255,255,255,.055);
  color:#fff;
  font-size:14px;
  transition:.2s;
}

input::placeholder{
  color:#788196;
}

input:focus{
  border-color:rgba(255,111,174,.65);
  box-shadow:0 0 0 4px rgba(255,111,174,.08);
}

.actions{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.btn{
  flex:1;
  border:0;
  border-radius:15px;
  padding:15px 20px;
  color:#fff;
  cursor:pointer;
  font-weight:800;
  font-size:13px;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  box-shadow:0 12px 35px rgba(255,105,170,.22);
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn.secondary{
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
  box-shadow:none;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

.error{
  min-height:20px;
  color:var(--danger);
  text-align:center;
  font-size:12px;
  line-height:1.5;
  margin-top:15px;
}

.switch{
  text-align:center;
  margin-top:22px;
  color:var(--muted);
  font-size:12px;
}

.switch a{
  color:#ff91bf;
  font-weight:800;
}

.footer{
  text-align:center;
  color:#697287;
  font-size:11px;
  margin-top:25px;
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-8px);
  }
}

@media(max-width:520px){

  .auth-card{
    padding:28px 20px;
  }

  h1{
    font-size:36px;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }
}
</style>

</head>

<body>

<div class="container">

<header>

<section class="auth">

<div class="icon">💌</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyC2esT1S9A8SnTBPyrHVfxTy-Z_u-GiGpWo",

  authDomain:
    "date-ticket-2e786.firebaseapp.com",

  databaseURL:
    "https://date-ticket-2e786-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "date-ticket-2e786",

  storageBucket:
    "date-ticket-2e786.firebasestorage.app",

  messagingSenderId:
    "576969359516",

  appId:
    "1:576969359516:web:2b9e622d7b2de86acc6d59"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/* =========================
   ELEMENTS
========================= */

const emailInput =
  document.querySelector("#email");

const passwordInput =
  document.querySelector("#password");

const loginBtn =
  document.querySelector("#loginBtn");

const errorBox =
  document.querySelector("#error");


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  errorBox.textContent = "";


  if(!email){

    errorBox.textContent =
      "Введи email.";

    emailInput.focus();

    return;
  }


  if(!password){

    errorBox.textContent =
      "Введи пароль.";

    passwordInput.focus();

    return;
  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    "Входим…";


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    const messages = {

      "auth/invalid-email":
        "Неверный формат email.",

      "auth/user-not-found":
        "Пользователь с таким email не найден.",

      "auth/wrong-password":
        "Неверный пароль.",

      "auth/invalid-credential":
        "Неверный email или пароль.",

      "auth/too-many-requests":
        "Слишком много попыток. Попробуй позже.",

      "auth/user-disabled":
        "Этот аккаунт отключён."

    };


    errorBox.textContent =
      messages[error.code] ||
      "Не удалось выполнить вход. Проверь данные.";

  }finally{

    loginBtn.disabled = false;

    loginBtn.textContent =
      "Войти";

  }

}


/* =========================
   BUTTON
========================= */

loginBtn.addEventListener(
  "click",
  login
);


/* =========================
   ENTER
========================= */

[emailInput,passwordInput].forEach(
  input => {

    input.addEventListener(
      "keydown",
      event => {

        if(event.key === "Enter"){

          login();

        }

      }
    );

  }
);


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      /*
       * Если пользователь уже вошёл,
       * отправляем его в creator.
       */

      window.location.href =
        "create.html";

    }

  }
);

</script>
