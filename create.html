<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Создать приглашение</title><style>
:root{--bg:#0b0b12;--card:#151521;--card2:#1d1d2b;--pink:#ff7eb6;--pink2:#ffc0db;--text:#faf8fb;--muted:#aaa8b8;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 10% 5%,rgba(255,126,182,.14),transparent 28%),radial-gradient(circle at 90% 95%,rgba(125,105,255,.12),transparent 30%),var(--bg);color:var(--text)}body{padding:20px}.wrap{width:min(980px,100%);margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900;letter-spacing:.05em}.brand span{color:var(--pink)}a{color:inherit;text-decoration:none}.hero,.panel{background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:28px;box-shadow:0 25px 80px rgba(0,0,0,.35);backdrop-filter:blur(18px)}.hero{padding:50px}.panel{padding:28px;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--pink2)}h1{font-size:clamp(34px,7vw,68px);line-height:.98;letter-spacing:-.05em;margin:12px 0 18px}h2{margin:8px 0 12px}.subtitle,.muted{color:var(--muted);line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 17px;font:inherit;font-weight:850;cursor:pointer;background:var(--pink);color:#26121c}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;color:var(--muted);font-weight:700}.input,textarea{width:100%;background:#0f0f18;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:13px;font:inherit;outline:none}.question{padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.025);margin:14px 0}.question h3{margin:0 0 7px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.option{padding:13px;border:1px solid var(--line);border-radius:13px;background:#10101a;cursor:pointer}.option.selected{border-color:var(--pink);background:rgba(255,126,182,.11)}.error{color:#ff9c9c;margin-top:12px}.success{color:#9ff0c5;margin-top:12px}.center{text-align:center}.feature{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.feature>div{padding:17px;border:1px solid var(--line);border-radius:18px}.ticket{overflow:hidden;background:linear-gradient(135deg,#fff9fc,#ffeaf4);color:#24161d;border-radius:28px;box-shadow:0 30px 90px rgba(255,126,182,.2);position:relative}.ticket:before,.ticket:after{content:"";position:absolute;top:64%;width:34px;height:34px;background:var(--bg);border-radius:50%;transform:translateY(-50%)}.ticket:before{left:-18px}.ticket:after{right:-18px}.ticket-top{padding:30px 34px;border-bottom:2px dashed #e5b8cb}.ticket-label{font-size:11px;font-weight:900;letter-spacing:.16em;color:#985c77}.ticket-title{font-size:40px;font-weight:950;margin:8px 0}.ticket-body{padding:30px 34px;display:grid;grid-template-columns:1.3fr .8fr;gap:25px}.ticket .small{color:#8b6878}.timer{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.timebox{min-width:75px;padding:12px 10px;border-radius:15px;background:rgba(255,255,255,.35);text-align:center}.timebox b{display:block;font-size:23px}.small{font-size:12px;color:var(--muted)}@media(max-width:700px){body{padding:12px}.hero{padding:30px 21px}.grid,.options,.feature,.ticket-body{grid-template-columns:1fr}.ticket-top,.ticket-body{padding:24px}.ticket-title{font-size:32px}}
</style></head><body>
<div class="wrap"><nav class="nav"><a class="brand" href="index.html">INVITE<span>01</span></a><button id="logout" class="btn secondary">Выйти</button></nav>
<section class="panel"><div class="eyebrow">шаг 1 · создатель</div><h1>Создай её билет</h1><p class="muted">Для каждого вопроса выбери ровно четыре варианта. Она увидит их как обычные варианты и не узнает, что список составил ты.</p>
<div class="grid"><div class="field"><label>Имя приглашённой</label><input id="name" class="input" placeholder="Алина"></div><div class="field"><label>Дата и время</label><input id="date" class="input" type="datetime-local"></div><div class="field"><label>Место</label><input id="place" class="input" placeholder="Кинотеатр / кафе / парк"></div><div class="field"><label>Название вечера</label><input id="event" class="input" placeholder="Наш вечер"></div></div></section>
<section class="panel"><div class="eyebrow">шаг 2 · вопросы</div><h2>Что ты хочешь узнать?</h2><div id="questions"></div><button id="create" class="btn">Создать приглашение</button><div id="msg"></div></section></div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDWuTix_eVqHnm76NlyVM19uKOF12PJ480",
  authDomain: "invite01.firebaseapp.com",
  projectId: "invite01",
  storageBucket: "invite01.firebasestorage.app",
  messagingSenderId: "183396425053",
  appId: "1:183396425053:web:a859c4996191e7217ddcb4"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
window.auth=auth; window.db=db;
window.fb={collection,doc,setDoc,getDoc,updateDoc,serverTimestamp,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut};
</script>
<script type="module">
const QUESTIONS=[
["Что для тебя главное на свидании?",["Поговорить по душам","Много смеяться","Чувствовать себя уютно","Получить новые впечатления","Долго гулять","Красиво провести вечер"]],
["Опиши свидание, которое тебе хотелось бы",["Тихий уютный вечер","Прогулка и разговоры","Кино и что-нибудь вкусное","Неожиданное приключение","Красивое место и фотографии","Вечер только вдвоём"]],
["Какое настроение тебе хочется почувствовать?",["Спокойствие","Романтику","Веселье","Волнение от чего-то нового","Тепло и уют","Лёгкость"]],
["Что хотелось бы попробовать вместе?",["Посмотреть фильм","Сходить куда-нибудь поесть","Долго гулять","Сделать совместные фотографии","Попробовать что-то новое","Просто провести время вдвоём"]],
["Что точно должно быть на нашем свидании?",["Вкусная еда","Красивое место","Много разговоров","Объятия","Неожиданный сюрприз","Что-нибудь смешное"]],
["Какой формат вечера тебе ближе?",["Кино","Прогулка","Кафе","Развлечения","Спокойный уютный вечер","Небольшое приключение"]],
["Что важнее всего в человеке рядом?",["Внимание","Чувство юмора","Забота","Искренность","Умение слушать","Спокойствие"]]
];
const root=document.getElementById("questions"),msg=document.getElementById("msg");let uid=null;
QUESTIONS.forEach((q,i)=>{const d=document.createElement("div");d.className="question";d.innerHTML="<h3>"+(i+1)+". "+q[0]+"</h3><div class='small'>Выбери ровно 4 варианта</div><div class='options'></div>";const box=d.querySelector(".options");q[1].forEach((o,j)=>{const b=document.createElement("div");b.className="option";b.textContent=o;b.dataset.i=j;b.onclick=()=>{const n=box.querySelectorAll(".selected").length;if(b.classList.contains("selected"))b.classList.remove("selected");else if(n<4)b.classList.add("selected")};box.appendChild(b)});root.appendChild(d)});
window.fb.onAuthStateChanged(window.auth,u=>{if(!u)location.href="login.html";else uid=u.uid});
document.getElementById("logout").onclick=()=>window.fb.signOut(window.auth).then(()=>location.href="index.html");
const nameInput=document.getElementById("name"),dateInput=document.getElementById("date"),placeInput=document.getElementById("place"),eventInput=document.getElementById("event");
document.getElementById("create").onclick=async()=>{try{if(!nameInput.value.trim()||!dateInput.value||!placeInput.value.trim())throw Error("Заполни имя, дату и место.");const qs=QUESTIONS.map((q,i)=>{const chosen=[...root.children[i].querySelectorAll(".selected")].map(x=>x.textContent);if(chosen.length!==4)throw Error("В вопросе "+(i+1)+" нужно выбрать ровно 4 варианта.");return {question:q[0],options:chosen}});const id=Math.random().toString(36).slice(2,9)+Date.now().toString(36);await window.fb.setDoc(window.fb.doc(window.db,"invitations",id),{creatorId:uid,name:nameInput.value.trim(),date:dateInput.value,place:placeInput.value.trim(),event:eventInput.value.trim()||"Наш вечер",questions:qs,createdAt:window.fb.serverTimestamp(),completed:false,inviteOpened:false});const uref=window.fb.doc(window.db,"users",uid),us=await window.fb.getDoc(uref),ids=us.exists()?(us.data().invitationIds||[]):[];await window.fb.setDoc(uref,{email:window.auth.currentUser.email,invitationIds:[...ids,id]},{merge:true});location.href="account.html"}catch(e){msg.className="error";msg.textContent=e.message}};
</script></body></html>
