<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Ticket — создать</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b12;--panel:#111722;--panel2:#171e2c;--line:rgba(255,255,255,.11);--text:#fff;--muted:#9da8ba;--pink:#ff5f9e;--pink2:#ff9ac3;--gold:#f5c86b;--green:#62d69b;--red:#ff6b7d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,rgba(255,95,158,.13),transparent 30%),radial-gradient(circle at 10% 100%,rgba(90,100,255,.13),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px);background-size:240px 210px}
a{color:inherit;text-decoration:none}.wrap{width:min(1120px,92%);margin:auto}header{height:78px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative;z-index:2}.logo{font:700 25px Georgia,serif;font-style:italic}.nav{display:flex;gap:8px;align-items:center}.nav a,.nav button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;border-radius:12px;padding:10px 13px;font-size:12px;cursor:pointer}.muted{color:var(--muted)}main{padding:45px 0 80px}.hero{min-height:calc(100vh - 78px);display:grid;place-items:center;text-align:center}.hero-card,.card{border:1px solid var(--line);background:rgba(17,23,34,.82);backdrop-filter:blur(18px);border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.hero-card{padding:55px;max-width:760px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:#ffb9d4}.hero h1,.page-title{font:700 clamp(42px,7vw,76px)/1.02 Georgia,serif;margin:14px 0}.hero p{color:var(--muted);line-height:1.8;max-width:600px;margin:0 auto 28px}.btn{border:0;border-radius:14px;padding:14px 20px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 12px 35px rgba(255,95,158,.2)}.btn.secondary{background:rgba(255,255,255,.055);border:1px solid var(--line);box-shadow:none}.btn.green{background:linear-gradient(135deg,#45bb82,var(--green))}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:25px}.card{padding:30px}.form{max-width:540px;margin:30px auto}.field{margin:18px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}.field input,.field textarea,.field select{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.055);color:#fff;outline:0}.field textarea{min-height:150px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(255,95,158,.7);box-shadow:0 0 0 4px rgba(255,95,158,.08)}.error{color:var(--red);font-size:13px;margin-top:12px}.success{color:var(--green);font-size:13px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.option{padding:17px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:17px;cursor:pointer;transition:.2s}.option:hover{transform:translateY(-2px)}.option.selected{border-color:var(--pink);background:rgba(255,95,158,.11)}.option .emoji{font-size:30px}.option small{display:block;color:var(--muted);margin-top:5px}.count{margin-top:12px;color:var(--muted);font-size:13px}.list{display:grid;gap:12px;margin-top:20px}.invite-item{border:1px solid var(--line);background:rgba(255,255,255,.04);padding:18px;border-radius:18px;display:flex;justify-content:space-between;gap:15px;align-items:center}.invite-item .meta{color:var(--muted);font-size:12px}.hidden{display:none!important}.center{text-align:center}.ticket{position:relative;max-width:760px;margin:30px auto;background:#f7f1e8;color:#171717;border-radius:22px;overflow:hidden;box-shadow:0 35px 100px rgba(0,0,0,.45);transform:rotate(-.25deg)}.ticket:before,.ticket:after{content:"";position:absolute;width:28px;height:28px;background:var(--bg);border-radius:50%;top:50%;transform:translateY(-50%);z-index:2}.ticket:before{left:-14px}.ticket:after{right:-14px}.ticket-top{background:#171b27;color:#fff;padding:28px 32px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.ticket-brand{font-size:11px;letter-spacing:2px;color:#ff9fc3;text-transform:uppercase}.ticket-top h1{font:700 42px Georgia,serif;margin:8px 0 0}.ticket-code{text-align:right;font-size:11px;color:#c5cad5}.ticket-main{padding:32px}.ticket-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:18px 0;border-bottom:1px dashed #c7c0b6}.ticket-row:last-child{border-bottom:0}.ticket-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#827b72}.ticket-value{font-weight:800;font-size:18px;margin-top:5px}.ticket-message{padding:25px 0;font-size:16px;line-height:1.7}.ticket-footer{border-top:1px dashed #c7c0b6;padding:18px 32px;display:flex;justify-content:space-between;font-size:11px;color:#6d675f}.barcode{height:48px;width:180px;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 5px,#111 5px 7px,transparent 7px 11px);opacity:.8}.answers{margin-top:25px}.answer-choice{padding:15px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:rgba(255,255,255,.04)}.selected-answer{border-color:var(--green);background:rgba(98,214,155,.1)}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:rgba(98,214,155,.1);color:var(--green);font-size:11px}.small{font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:700px){.hero-card{padding:35px 22px}.grid,.two,.ticket-row{grid-template-columns:1fr}.ticket-top{padding:22px}.ticket-top h1{font-size:32px}.ticket-main{padding:22px}.nav .email{display:none}.invite-item{align-items:flex-start;flex-direction:column}.actions{justify-content:stretch}.actions .btn{flex:1}}
</style></head><body><div class="wrap">
<header><a class="logo" href="index.html">Date Ticket</a><nav class="nav"><a href="account.html">Аккаунт</a></nav></header>
<main><section class="card"><div class="eyebrow">creator</div><h1 class="page-title" style="font-size:52px">Создай билет на свидание.</h1><p class="muted">Заполни всё по шагам. Получатель увидит только четыре выбранных тобой варианта.</p>
<div id="stepArea"></div><div class="actions"><button id="prev" class="btn secondary">← Назад</button><button id="next" class="btn">Далее →</button></div><div id="msg" class="error"></div></section></main>
</div><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import {getFirestore,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyC2esT1S9A8SnTBPyrHVfxTy-Z_u-GiGpWo",
  authDomain: "date-ticket-2e786.firebaseapp.com",
  databaseURL: "https://date-ticket-2e786-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "date-ticket-2e786",
  storageBucket: "date-ticket-2e786.firebasestorage.app",
  messagingSenderId: "576969359516",
  appId: "1:576969359516:web:f98ef1519fe502d4cc6d59"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const opts=[["☕","Кофейня"],["🎬","Кино"],["🌳","Парк"],["🎳","Боулинг"],["🌅","Набережная"],["🎨","Мастер-класс"],["🧺","Пикник"],["🎡","Аттракционы"],["🍕","Пиццерия"],["🍰","Кондитерская"],["🎮","Игровой клуб"],["📚","Книжный"],["🛼","Каток"],["🎤","Концерт"],["🌌","Ночная прогулка"],["🍜","Ресторан"]];
const s={nickname:"",character:"🐸",theme:"Сакура",from:"",to:"",time:"18:00",letter:"",letterDate:"",survey:[]};
let step=0;
const steps=[
{title:"Обращение",render:()=>`<h2>Как обращаться к получателю?</h2><p class="muted">Это имя появится в билете.</p><div class="field"><label>Обращение</label><input id="nickname" maxlength="35" value="${s.nickname}" placeholder="Например: Алина, Любимая..."></div>`},
{title:"Персонаж",render:()=>`<h2>Кто встретит получателя?</h2><div class="grid" id="chars">${[["🐸","Лягушка"],["🦊","Лисёнок"],["🐱","Котик"],["🐻","Мишка"],["🐰","Зайчик"],["🤖","Робот"]].map(x=>`<div class="option ${s.character===x[0]?"selected":""}" data-char="${x[0]}"><div class="emoji">${x[0]}</div><b>${x[1]}</b></div>`).join("")}</div>`},
{title:"Оформление",render:()=>`<h2>Выбери атмосферу</h2><div class="grid" id="themes">${["🌸 Сакура","🌌 Галактика","🌅 Закат","🌧️ Дождь","🌊 Океан","🌃 Ночной город"].map(x=>`<div class="option ${s.theme===x.slice(2)?"selected":""}" data-theme="${x.slice(2)}"><div class="emoji">${x.slice(0,2)}</div><b>${x.slice(2)}</b></div>`).join("")}</div>`},
{title:"Дата",render:()=>`<h2>Когда можно встретиться?</h2><div class="two"><div class="field"><label>От</label><input id="from" type="date" value="${s.from}"></div><div class="field"><label>До</label><input id="to" type="date" value="${s.to}"></div></div><div class="field"><label>Время</label><input id="time" type="time" value="${s.time}"></div>`},
{title:"Письмо",render:()=>`<h2>Личное сообщение</h2><p class="muted">Оно сохранится вместе с приглашением.</p><div class="field"><label>Письмо</label><textarea id="letter" maxlength="3000">${s.letter}</textarea></div><div class="field"><label>Когда открыть письмо?</label><input id="letterDate" type="datetime-local" value="${s.letterDate}"></div>`},
{title:"Вопросы",render:()=>`<h2>Выбери ровно 4 варианта свидания</h2><p class="muted">Именно эти варианты увидит получатель.</p><div class="grid" id="survey">${opts.map(x=>`<div class="option ${s.survey.includes(x[1])?"selected":""}" data-name="${x[1]}"><div class="emoji">${x[0]}</div><b>${x[1]}</b></div>`).join("")}</div><div class="count">Выбрано: <b id="count">${s.survey.length}</b> / 4</div>`},
{title:"Проверка",render:()=>`<h2>Проверь билет</h2><div class="list"><div class="answer-choice"><b>Обращение:</b> ${s.nickname||"—"}</div><div class="answer-choice"><b>Персонаж:</b> ${s.character}</div><div class="answer-choice"><b>Тема:</b> ${s.theme}</div><div class="answer-choice"><b>Дата:</b> ${s.from||"—"} → ${s.to||"—"} в ${s.time}</div><div class="answer-choice"><b>Письмо:</b> ${s.letter?"есть":"нет"}</div><div class="answer-choice"><b>Варианты:</b> ${s.survey.join(", ")||"—"}</div></div>`}
];
function render(){$("stepArea").innerHTML=`<div class="muted small">Шаг ${step+1} из ${steps.length} · ${steps[step].title}</div>${steps[step].render()}`;$("prev").disabled=step===0;$("next").textContent=step===steps.length-1?"Создать билет ✨":"Далее →";bind();}
function bind(){
$("nickname")?.addEventListener("input",e=>s.nickname=e.target.value.trim());
$("from")?.addEventListener("input",e=>s.from=e.target.value);$("to")?.addEventListener("input",e=>s.to=e.target.value);$("time")?.addEventListener("input",e=>s.time=e.target.value);
$("letter")?.addEventListener("input",e=>s.letter=e.target.value);$("letterDate")?.addEventListener("input",e=>s.letterDate=e.target.value);
document.querySelectorAll("[data-char]").forEach(e=>e.onclick=()=>{s.character=e.dataset.char;render();});
document.querySelectorAll("[data-theme]").forEach(e=>e.onclick=()=>{s.theme=e.dataset.theme;render();});
document.querySelectorAll("[data-name]").forEach(e=>e.onclick=()=>{const n=e.dataset.name;if(s.survey.includes(n))s.survey=s.survey.filter(x=>x!==n);else if(s.survey.length<4)s.survey.push(n);render();});
}
$("prev").onclick=()=>{if(step>0){step--;render();}};
$("next").onclick=async()=>{
$("msg").textContent="";
if(step===0&&!s.nickname){$("msg").textContent="Укажи обращение.";return}
if(step===3&&(!s.from||!s.to||s.from>s.to)){$("msg").textContent="Проверь диапазон дат.";return}
if(step===5&&s.survey.length!==4){$("msg").textContent="Выбери ровно 4 варианта.";return}
if(step<steps.length-1){step++;render();return}
const u=auth.currentUser;if(!u){location.href="login.html";return}
$("next").disabled=true;$("next").textContent="Создаём…";
try{const ref=await addDoc(collection(db,"invitations"),{ownerUid:u.uid,ownerEmail:u.email||"",nickname:s.nickname,character:s.character,theme:s.theme,from:s.from,to:s.to,time:s.time,letter:s.letter,letterDate:s.letterDate,survey:s.survey,status:"created",response:null,respondedAt:null,createdAt:serverTimestamp()});localStorage.removeItem("dateTicketDraft");location.href="create-with-answers.html?id="+encodeURIComponent(ref.id);}
catch(e){console.error(e);$("msg").textContent="Не удалось создать приглашение: "+e.code;}
finally{$("next").disabled=false;$("next").textContent="Создать билет ✨";}
};
onAuthStateChanged(auth,u=>{if(!u)location.href="login.html";else render();});
</script></body></html>
